services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: py_api:local
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      PY_API_ENVIRONMENT: ${PY_API_ENVIRONMENT:-docker}
      PY_API_DEBUG: ${PY_API_DEBUG:-false}
      PY_API_DATABASE_URL: ${PY_API_DATABASE_URL:-}
      PY_API_REDIS_URL: ${PY_API_REDIS_URL:-}
      PY_API_COGNITO_ISSUER: ${PY_API_COGNITO_ISSUER:-}
      PY_API_COGNITO_DOMAIN: ${PY_API_COGNITO_DOMAIN:-}
      PY_API_COGNITO_CLIENT_ID: ${PY_API_COGNITO_CLIENT_ID:-}
      PY_API_COGNITO_CLIENT_SECRET: ${PY_API_COGNITO_CLIENT_SECRET:-}
      PY_API_COGNITO_AUDIENCE: ${PY_API_COGNITO_AUDIENCE:-}
      PY_API_COGNITO_ADMIN_GROUP: ${PY_API_COGNITO_ADMIN_GROUP:-}
      PY_API_COGNITO_SCOPE: ${PY_API_COGNITO_SCOPE:-openid}
      PY_API_AUTH_REDIRECT_URI: ${PY_API_AUTH_REDIRECT_URI:-}
      PY_API_FRONTEND_ORIGIN: ${PY_API_FRONTEND_ORIGIN:-}
      PY_API_FRONTEND_REDIRECT_URL: ${PY_API_FRONTEND_REDIRECT_URL:-}
      PY_API_REFRESH_COOKIE_MAX_AGE: ${PY_API_REFRESH_COOKIE_MAX_AGE:-2592000}
      PY_API_COGNITO_REFRESH_TOKEN_LIFETIME: ${PY_API_COGNITO_REFRESH_TOKEN_LIFETIME:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health-check', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
