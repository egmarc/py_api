name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: py_api_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d py_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Poetry
        run: pipx install poetry==2.5.2

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Initialize PostgreSQL reference schema
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d py_api_test < src/migrations/001_init.sql

      - name: Run in-process tests with PostgreSQL
        env:
          PY_API_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:${{ job.services.postgres.ports[5432] }}/py_api_test
          PY_API_TEST_REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}/0
        run: poetry run pytest -q

      - name: Build and start API container
        run: docker compose up -d --build --wait

      - name: Run integration tests against container
        env:
          API_BASE_URL: http://localhost:8000
        run: poetry run pytest -m integration -v

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop API container
        if: always()
        run: docker compose down
