[project]
name = "py_api"
version = "0.1.0"
description = ""
authors = [
    {name = "Eugene Marchev",email = "egmprime@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "pyjwt[crypto] (>=2.10,<3)",
    "httpx (>=0.28,<1.0)",
    "redis (>=5,<7)"
]

[tool.poetry]
packages = [{ include = "py_api", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "fakeredis (>=2.30,<3)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: integration tests that exercise the API over HTTP"]
