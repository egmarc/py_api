[project]
name = "py_api"
version = "0.1.0"
description = ""
authors = [
    {name = "Eugene Marchev",email = "egmprime@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)"
]

[tool.poetry]
packages = [{ include = "py_api", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: integration tests that exercise the API over HTTP"]
